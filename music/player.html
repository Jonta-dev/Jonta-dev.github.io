<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>LoveCraft Music Player</title>
</head>
<body style="margin:0;background:black;display:flex;justify-content:center;align-items:center;height:100vh;">

<audio id="player" controls autoplay>
    <source id="source" src="Behind%20Your%20Painted%20Eyes.mp3" type="audio/mpeg">
</audio>

<script>

const playlist = [
"Behind%20Your%20Painted%20Eyes.mp3",
"Born%20to%20Be.mp3",
"Choke.mp3",
"Eurodance.mp3",
"Overloaded%20Heart.mp3",
"Rise%20Through%20Me.mp3",
"Take%20Control.mp3"
];

let current = 0;

const player = document.getElementById("player");

player.addEventListener("ended", () => {
    current++;

    if(current >= playlist.length)
        current = 0;

    player.src = playlist[current];
    player.play();
});

window.onload = () => {
    player.src = playlist[0];
    player.play();
};

</script>

</body>
</html>
